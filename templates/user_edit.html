{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
            <h3 class="fw-bold mb-3 text-center text-primary">✏️ યુઝર સુધારો</h3>
            
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">યુઝરનેમ:</label>
                    <input type="text" class="form-control" value="{{ user.username }}" disabled>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">રોલ (Role):</label>
                    <select name="role" class="form-select">
                        <option value="Super Admin" {% if user.role == 'Super Admin' %}selected{% endif %}>Super Admin</option>
                        <option value="Admin" {% if user.role == 'Admin' %}selected{% endif %}>Admin</option>
                        <option value="Farm Head" {% if user.role == 'Farm Head' %}selected{% endif %}>Farm Head</option>
                        <option value="Staff" {% if user.role == 'Staff' %}selected{% endif %}>Staff</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">કુટુંબ પસંદ કરો (જો Farm Head હોય તો):</label>
                    <select name="family_id" class="form-select">
                        <option value="">-- કુટુંબ પસંદ કરો --</option>
                        {% for f in families %}
                            <option value="{{ f.id }}" {% if user.family_id == f.id %}selected{% endif %}>{{ f.family_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2">💾 અપડેટ કરો</button>
                <a href="/users" class="btn btn-outline-secondary w-100 mt-2">🔙 પાછા જાઓ</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
