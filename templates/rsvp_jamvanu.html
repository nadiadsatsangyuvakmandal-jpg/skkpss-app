<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ event[1] }} - RSVP</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Noto Sans Gujarati', 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
        margin: 0;
        padding: 20px;
        color: #1e293b;
    }
    .card {
        max-width: 560px;
        margin: 0 auto;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(154, 52, 18, 0.12);
        overflow: hidden;
    }
    .header {
        background: #9a3412;
        color: #fff;
        padding: 22px 24px;
        text-align: center;
    }
    .header h1 { margin: 0 0 6px; font-size: 20px; }
    .header p { margin: 2px 0; font-size: 13px; opacity: 0.9; }
    form { padding: 24px; }
    .field { margin-bottom: 16px; }
    label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 6px;
        color: #334155;
    }
    input, select, textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 15px;
        font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #9a3412;
        box-shadow: 0 0 0 3px rgba(154, 52, 18, 0.1);
    }
    .row2 { display: flex; gap: 12px; }
    .row2 .field { flex: 1; }
    button {
        width: 100%;
        padding: 13px;
        background: #9a3412;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 8px;
    }
    button:hover { background: #7c2d12; }
    .expired {
        text-align: center;
        padding: 40px 24px;
        color: #dc2626;
        font-size: 17px;
    }
    .required { color: #dc2626; }
</style>
</head>
<body>
<div class="card">
    <div class="header">
        <h1>🍽️ {{ event[1] }}</h1>
        <p>📅 તારીખ: {{ event[2] }} &nbsp;|&nbsp; ⏰ ડેડલાઈન: {{ event[3] }}</p>
    </div>

    {% if is_expired %}
    <div class="expired">
        ⚠️ ક્ષમા કરશો, આ RSVP લિંકની ડેડલાઈન પૂરી થઈ ગઈ છે.
    </div>
    {% else %}
    <form method="POST">
        <div class="field">
            <label>પરિવાર / ફર્મ પસંદ કરો <span class="required">*</span></label>
            <select name="family_id" id="family_id" required onchange="lookupExisting()">
                <option value="">-- પસંદ કરો --</option>
                {% for f in families %}
                <option value="{{ f[0] }}">{{ f[1] }}</option>
                {% endfor %}
            </select>
            <div id="existingNotice" style="display:none; margin-top:8px; background:#ecfdf5; border:1.5px solid #6ee7b7; color:#065f46; border-radius:8px; padding:8px 10px; font-size:12.5px; font-weight:600;">
                ✅ તમે પહેલા આ ફોર્મ ભરેલું છે — તમારી અગાઉની વિગત નીચે આપોઆપ ભરાઈ ગઈ છે. જરૂર હોય તો બદલીને ફરી સબમિટ કરો.
            </div>
        </div>

        <div class="row2">
            <div class="field">
                <label>સંપર્ક વ્યક્તિનું નામ <span class="required">*</span></label>
                <input type="text" name="member_name" id="member_name" required>
            </div>
            <div class="field">
                <label>મોબાઈલ નંબર</label>
                <input type="tel" name="mobile_number" id="mobile_number" placeholder="9876543210">
            </div>
        </div>

        <div class="field">
            <label>કુલ જમનારાઓની સંખ્યા <span class="required">*</span></label>
            <input type="number" name="head_count" id="head_count" min="1" value="1" required>
        </div>

        <div class="field">
            <label>ભોજનનો પ્રકાર</label>
            <select name="meal_type">
                <option value="lunch">બપોરનું ભોજન</option>
                <option value="dinner">રાત્રિ ભોજન</option>
                <option value="breakfast">સવારનો નાસ્તો</option>
            </select>
        </div>

        <div class="field">
            <label>વધારાની માહિતી (વિશેષ જરૂરિયાત, વગેરે)</label>
            <textarea name="other_info" id="other_info" rows="2"></textarea>
        </div>

        <button type="submit">✅ RSVP સબમિટ કરો</button>
    </form>
    {% endif %}
</div>
<script>
function lookupExisting() {
    var familyId = document.getElementById('family_id').value;
    var notice = document.getElementById('existingNotice');
    if (!familyId) { notice.style.display = 'none'; return; }
    fetch('/rsvp/{{ event[0] }}/lookup/' + familyId)
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (!data.found) { notice.style.display = 'none'; return; }
            notice.style.display = 'block';
            document.getElementById('member_name').value = data.member_name || '';
            document.getElementById('mobile_number').value = data.mobile_number || '';
            if (data.head_count) document.getElementById('head_count').value = data.head_count;
            document.getElementById('other_info').value = data.other_info || '';
        })
        .catch(function() { notice.style.display = 'none'; });
}
</script>
</body>
</html>
